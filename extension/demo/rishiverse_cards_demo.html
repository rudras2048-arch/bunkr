<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rishiverse ERP — Attendance Cards Live Preview | Bunkr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../content/content.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FCF9F8;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Top ERP Shell */
    .rv-topbar {
      background: #FFFFFF;
      border-bottom: 1px solid #F1E8E6;
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .rv-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #111827;
    }

    .rv-crest {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: #C42B2B;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .rv-brand-text {
      line-height: 1.1;
    }

    .rv-brand-text strong {
      display: block;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1E293B;
    }

    .rv-brand-text span {
      font-size: 10.5px;
      color: #64748B;
      font-weight: 500;
    }

    .rv-topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rv-demo-btn {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      color: #334155;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .rv-demo-btn:hover {
      border-color: #CBD5E1;
      background: #F8FAFC;
    }

    .rv-switch-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #F1F5F9;
      padding: 3px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .rv-switch-pill span {
      padding: 4px 10px;
      border-radius: 999px;
      color: #64748B;
    }

    .rv-switch-pill span.active {
      background: #FFFFFF;
      color: #B91C1C;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .rv-layout {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    .rv-sidebar {
      width: 60px;
      background: #FFFFFF;
      border-right: 1px solid #F1E8E6;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .rv-nav-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94A3B8;
      font-size: 16px;
    }

    .rv-nav-icon.active {
      background: #FEE2E2;
      color: #B91C1C;
    }

    .rv-main {
      flex: 1;
      max-width: 1140px;
      margin: 0 auto;
      padding: 24px 36px 56px 36px;
    }

    .rv-page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0 22px 0;
      flex-wrap: wrap;
    }

    .rv-page-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: #B91C1C;
      letter-spacing: -0.02em;
    }

    .rv-sem-select {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      background: #FFFFFF;
      border: 1px solid #E5C9C9;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }

    /* 2-Column Attendance Cards Grid matching Rishiverse ERP */
    .rv-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .rv-course-card {
      background: #FFFFFF;
      border: 1px solid #F1EAE8;
      border-radius: 14px;
      padding: 20px 22px 16px 22px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .rv-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .rv-card-title {
      font-size: 15.5px;
      font-weight: 700;
      color: #111827;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .rv-tags {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .rv-tag {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      background: #F1F5F9;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .rv-ring-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .rv-ring {
      position: relative;
      width: 58px;
      height: 58px;
    }

    .rv-ring svg {
      transform: rotate(-90deg);
      width: 58px;
      height: 58px;
    }

    .rv-ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #111827;
      font-variant-numeric: tabular-nums;
    }

    .rv-ring-caption {
      font-size: 11px;
      color: #475569;
      margin-top: 5px;
      font-weight: 500;
    }

    .rv-card-footer {
      border-top: 1px solid #F1F5F9;
      margin-top: 16px;
      padding-top: 12px;
      text-align: right;
      font-size: 12.5px;
      color: #334155;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .rv-demo-note {
      margin-top: 14px;
      font-size: 12px;
      color: #64748B;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 820px) {
      .rv-sidebar { display: none; }
      .rv-main { padding: 18px 16px 40px 16px; }
      .rv-cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="rv-topbar">
    <a href="/" class="rv-brand">
      <span class="rv-crest">r</span>
      <span class="rv-brand-text">
        <strong>rishihood</strong>
        <span>university · ERP preview</span>
      </span>
    </a>

    <div class="rv-topbar-right">
      <button type="button" id="demo-faculty-edit-btn" class="rv-demo-btn" title="Simulate a faculty adjustment on Social Communication I (23 -> 21) to prove zero false drift">
        Simulate Faculty Edit (23 → 21)
      </button>
      <a href="/newtab/newtab.html" class="rv-demo-btn">Command Center</a>
      <a href="/" class="rv-demo-btn">Back to Showcase</a>
      <div class="rv-switch-pill" aria-hidden="true">
        <span class="active">ERP</span>
        <span>LMS</span>
      </div>
    </div>
  </header>

  <div class="rv-layout">
    <aside class="rv-sidebar" aria-hidden="true">
      <div class="rv-nav-icon">🎓</div>
      <div class="rv-nav-icon active">📅</div>
      <div class="rv-nav-icon">📋</div>
    </aside>

    <main class="rv-main">
      <!-- Bunkr injects #attendmate-page-banner cleanly above this header -->
      <div class="rv-page-head">
        <h1 class="rv-page-title">← Attendance</h1>
        <label style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:12px; color:#64748B; font-weight:600;">Active Term:</span>
          <select id="rv-semester-select" class="rv-sem-select" aria-label="Select semester">
            <option value="Semester 1" selected>Semester 1</option>
            <option value="Semester 2">Semester 2</option>
          </select>
        </label>
      </div>

      <div id="rv-cards-grid" class="rv-cards-grid">
        <!-- Populated dynamically for Semester 1 / Semester 2 -->
      </div>

      <div class="rv-demo-note">
        <span>Live Extension Sandbox — running Bunkr's real <code>parser.js</code>, <code>ui.js</code>, <code>engine.js</code>, and <code>content.js</code>.</span>
        <span id="rv-demo-status">Ready · Switch semesters above to verify semester-scoped caching (zero drift).</span>
      </div>
    </main>
  </div>

  <script>
    const SEMESTER_DATASETS = {
      'Semester 1': [
        { name: 'KPMG/Edept Workshop Certification Program', section: 'Sec-B', code: 'CSDS-2601', attended: 1, total: 3, presentPct: 33, excusedPct: 0 },
        { name: 'Problem Solving and Programming', section: 'Sec-A', code: 'CSD02C1002', attended: 34, total: 41, presentPct: 83, excusedPct: 0 },
        { name: 'Self and Society I', section: 'Sec-A', code: 'RSPRFC1002', attended: 9, total: 10, presentPct: 90, excusedPct: 0 },
        { name: 'Web Application Development I', section: 'Sec-A', code: 'CSD02C1003', attended: 36, total: 40, presentPct: 90, excusedPct: 0 },
        { name: 'Computer fundamentals and networking', section: 'Sec-A', code: 'CSD02C1004', attended: 19, total: 22, presentPct: 86, excusedPct: 0 },
        { name: 'Social Communication I', section: 'Sec-A', code: 'RSPRFC1003', attended: 19, total: 21, presentPct: 81, excusedPct: 10 }
      ],
      'Semester 2': [
        { name: 'Data Structures & Algorithms', section: 'Sec-A', code: 'CSD02C2001', attended: 26, total: 30, presentPct: 87, excusedPct: 0 },
        { name: 'Database Management Systems', section: 'Sec-A', code: 'CSD02C2002', attended: 18, total: 24, presentPct: 75, excusedPct: 0 },
        { name: 'Discrete Mathematics', section: 'Sec-A', code: 'CSD02C2003', attended: 14, total: 20, presentPct: 70, excusedPct: 5 },
        { name: 'Operating Systems Fundamentals', section: 'Sec-B', code: 'CSD02C2004', attended: 22, total: 25, presentPct: 88, excusedPct: 0 }
      ]
    };

    function renderRishiverseCards(semesterName) {
      const grid = document.getElementById('rv-cards-grid');
      const courses = SEMESTER_DATASETS[semesterName] || SEMESTER_DATASETS['Semester 1'];
      const r = 24;
      const circumference = 2 * Math.PI * r;

      grid.innerHTML = courses.map((c) => {
        const pct = c.total > 0 ? Math.round((c.attended / c.total) * 100) : 0;
        const strokeColor = pct >= 75 ? '#16A34A' : '#EF4444';
        const dashOffset = circumference * (1 - Math.min(1, pct / 100));
        return `
          <article class="rv-course-card course-card">
            <div class="rv-card-top">
              <div>
                <h3 class="rv-card-title">${c.name}</h3>
                <div class="rv-tags">
                  <span class="rv-tag">${c.section}</span>
                  <span class="rv-tag">${c.code}</span>
                </div>
              </div>
              <div class="rv-ring-wrap">
                <div class="rv-ring">
                  <svg viewBox="0 0 58 58">
                    <circle cx="29" cy="29" r="${r}" fill="none" stroke="#E5E7EB" stroke-width="4.5"></circle>
                    <circle cx="29" cy="29" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${dashOffset.toFixed(1)}"></circle>
                  </svg>
                  <span class="rv-ring-label">${c.attended}/${c.total}</span>
                </div>
                <span class="rv-ring-caption">Attendance lectures</span>
              </div>
            </div>
            <div class="rv-card-footer">
              Present: ${c.presentPct}% &bull; Excused: ${c.excusedPct}%
            </div>
          </article>
        `;
      }).join('');
    }

    renderRishiverseCards('Semester 1');

    document.getElementById('rv-semester-select').addEventListener('change', (e) => {
      const sem = e.target.value;
      renderRishiverseCards(sem);
      document.getElementById('rv-demo-status').textContent = `Switched to ${sem} · Semester-scoped cache isolated cleanly (zero drift).`;
      if (typeof window.BunkrRescan === 'function') {
        setTimeout(() => window.BunkrRescan(), 60);
      }
    });

    document.getElementById('demo-faculty-edit-btn').addEventListener('click', () => {
      const semSel = document.getElementById('rv-semester-select');
      semSel.value = 'Semester 1';
      // Seed prior baseline with 23 held on Social Communication I, then re-render 21 held
      try {
        const key = 'bunkr_last_good_scrape_semester_1';
        const seeded = {
          timestamp: Date.now() - 86400000,
          subjects: SEMESTER_DATASETS['Semester 1'].map((c) => (
            c.code === 'RSPRFC1003'
              ? { name: c.name, code: c.code, attended: 21, total: 23, percentage: 91.3 }
              : { name: c.name, code: c.code, attended: c.attended, total: c.total, percentage: (c.attended / c.total) * 100 }
          ))
        };
        localStorage.setItem(key, JSON.stringify(seeded));
      } catch (e) {}
      renderRishiverseCards('Semester 1');
      if (typeof window.BunkrRescan === 'function') {
        window.BunkrRescan();
      }
      document.getElementById('rv-demo-status').textContent = 'Simulated faculty edit (Social Communication I: 23 → 21) · Handled smoothly without false drift or stability pause.';
    });
  </script>

  <!-- Live Bunkr Extension Scripts -->
  <script src="../data/timetable.js"></script>
  <script src="../lib/engine.js"></script>
  <script src="../content/math.js"></script>
  <script src="../content/parser.js"></script>
  <script src="../content/ui.js"></script>
  <script src="../content/content.js"></script>
</body>
</html>
